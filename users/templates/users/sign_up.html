{% extends "modreg/base.html" %}
{%load crispy_forms_tags%}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <!-- Registration page connected to forms -->
            <legend class="border-bottom mb-4">Student Registration Form</legend>
            {{ form | crispy }}
        </fieldset>
        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">Sign Up</button>
        </div>
    </form>
    <!-- Link to refirect to login page -->
    <div class="border-top pt-3">
        <small class="text-muted">
            Already Registered? <a class="ml-2" href="#">Login</a>
        </small>
    </div>
</div>
{% endblock content %}
