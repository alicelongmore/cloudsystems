{% extends "modreg/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <legend class="border-bottom mb-4">Module Registration Services - Login</legend>
            {{ form|crispy}}
        </fieldset>
        <!-- Login funtionality connected to forms -->
        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">Login</button>
        </div>
    </form>
    <!-- Registration Link -->
    <div class="border-top pt-3">
        <small class="text-muted"> Need to create an account?<a class="ml-2" href="{% url 'sign_up' %}">Sign Up</a>
        </small>
    </div>
    <!-- Password Reset Link -->
    <div class="border-top pt-3">
        <small class="text-muted"> Forgotten your password?<a class="ml-2" href="{% url 'password_reset' %}">Reset Password</a>
        </small>
    </div>
</div>
{% endblock content %}
